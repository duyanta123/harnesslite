name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The "full" build stages a complete Node runtime into the installer so
      # the app works on machines without Node. Locally this caches in
      # runtime-cache/; on CI it downloads fresh each release.
      - name: Stage offline Node runtime
        run: node scripts/prepare-runtime.mjs
        env:
          HARNESSLITE_NODE_VERSION: v22.21.0

      # The updater artifacts (.sig) only exist when the signing key is
      # present; without it the release would ship without an update feed.
      - name: Build bundles
        run: pnpm tauri build --config src-tauri/tauri.full.conf.json
        env:
          HARNESSLITE_EDITION: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # This repository's updater key is encrypted with an empty password.
          # Supplying it explicitly keeps the bundler non-interactive in CI.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Build the updater manifest
        run: |
          node scripts/make-updater-manifest.mjs `
            --tag ${{ github.ref_name }} `
            --out src-tauri/target/release/bundle/updater/latest.json

      - name: Verify release assets
        run: node scripts/verify-release-assets.mjs
        env:
          EXPECTED_TAG: ${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/harnesslite.exe
            src-tauri/target/release/bundle/updater/latest.json
          generate_release_notes: true
